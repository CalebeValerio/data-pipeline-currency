name: Pipeline Diario de Cotacoes

# Define quando o robô acorda
on:
  # 1. Permite que você clique em um botão no site do GitHub para rodar na hora (para testes)
  workflow_dispatch:

  # 2. Agendamento automático (Cron expression: todo dia às 12:00 UTC / 09:00 Horário de Brasília)
  schedule:
    - cron: '0 12 * * *'

jobs:
  executar-pipeline:
    runs-on: ubuntu-latest # O GitHub liga uma máquina virtual Linux de graça na nuvem

    steps:
      # Baixa o seu código para a máquina virtual
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      # Instala o Python na máquina virtual
      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Instala as bibliotecas listadas no seu requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Executa o seu script de dados
      - name: Rodar pipeline.py
        run: python pipeline.py
        # Executa o seu script de dados usando o segredo do cofre
      - name: Rodar pipeline.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline.py